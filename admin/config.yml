backend:
  name: github
  repo: deninluvis/thedframes
  branch: main

media_folder: "uploads"
public_folder: "/uploads"

collections:
  - name: "home"
    label: "Home Page"
    files:
      - file: "content/home.json"
        label: "Hero Mosaic"
        name: "home"
        fields:
          - label: "Mosaic Images"
            name: "mosaic"
            widget: "list"
            hint: "Add exactly 4, in order — they fill the mosaic left-to-right, top-to-bottom. Images 1 & 2 (top row) look best as portrait, about 2:3 (e.g. 1000×1500px). Images 3 & 4 (bottom row) look best roughly square, about 1:1 (e.g. 1000×1000px). All images are cropped to fit, so exact size isn't critical — just aim for that orientation."
            max: 4
            fields:
              - { label: "Image", name: "image", widget: "image" }
              - { label: "Alt Text", name: "alt", widget: "string" }

  - name: "photos"
    label: "Photography"
    files:
      - file: "content/photos.json"
        label: "Photo Gallery"
        name: "photos"
        fields:
          - label: "Projects"
            name: "projects"
            widget: "list"
            summary: "{{title}}"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Slug", name: "slug", widget: "string", hint: "Used in the URL, e.g. sarah-and-tom-wedding — lowercase, no spaces." }
              - { label: "Cover Image", name: "coverImage", widget: "image" }
              - { label: "Cover Alt Text", name: "coverAlt", widget: "string", required: false }
              - { label: "Description", name: "description", widget: "text", required: false }
              - label: "Photos"
                name: "photos"
                widget: "list"
                fields:
                  - { label: "Image", name: "image", widget: "image" }
                  - { label: "Label", name: "label", widget: "string", required: false }
                  - { label: "Alt Text", name: "alt", widget: "string", required: false }

  - name: "film"
    label: "Film"
    files:
      - file: "content/film.json"
        label: "Film Reel"
        name: "film"
        fields:
          - label: "Films"
            name: "items"
            widget: "list"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Category", name: "category", widget: "string" }
              - { label: "Description", name: "description", widget: "text" }
              - { label: "Duration", name: "timestamp", widget: "string", hint: "e.g. 3:42" }
              - { label: "YouTube Video ID", name: "videoId", widget: "string", hint: "The part after ?v= in the YouTube URL" }
              - { label: "Thumbnail", name: "thumbnail", widget: "image" }
              - { label: "Alt Text", name: "alt", widget: "string", required: false }

  - name: "about"
    label: "About Page"
    files:
      - file: "content/about.json"
        label: "About Content"
        name: "about"
        fields:
          - { label: "Hero Image", name: "heroImage", widget: "image", required: false, hint: "Portrait orientation works best, about 2:3 (e.g. 1000×1500px). It fills the whole left panel and is cropped to fit." }
          - { label: "Hero Image Alt", name: "heroAlt", widget: "string", required: false }
          - { label: "Photographer Portrait", name: "photographerPortrait", widget: "image", required: false, hint: "Square, 1:1 (e.g. 600×600px) — it's cropped into a circle." }
          - { label: "Photographer Alt", name: "photographerAlt", widget: "string", required: false }
          - { label: "Videographer Portrait", name: "videographerPortrait", widget: "image", required: false, hint: "Square, 1:1 (e.g. 600×600px) — it's cropped into a circle." }
          - { label: "Videographer Alt", name: "videographerAlt", widget: "string", required: false }
