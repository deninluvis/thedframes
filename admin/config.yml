backend:
  name: github
  repo: deninluvis/thedframes
  branch: main

media_folder: "uploads"
public_folder: "/uploads"

collections:
  # ───────────────────────── Home ─────────────────────────
  - name: "home"
    label: "Home Page"
    description: "The opening screen of the site."
    files:
      - file: "content/home.json"
        label: "Opening Screen"
        name: "home"
        fields:
          - label: "Opening Image"
            name: "heroImage"
            widget: "image"
            required: false
            hint: "The big picture behind your name on the home page. Use a wide landscape photo, at least 2400px across; the top and bottom are cropped to a cinema-style strip. Leave empty to show the built-in stock photo."
          - label: "Opening Image Title"
            name: "heroTitle"
            widget: "string"
            required: false
            hint: "Small faded text at the bottom right of the opening image, e.g. \"First light, Bluffers Park\". Only shown when you have uploaded your own image. Leave empty to show nothing."
          - label: "Opening Image Description"
            name: "heroAlt"
            widget: "string"
            required: false
            hint: "One sentence describing the image for visitors using a screen reader, e.g. \"Sunrise over a lake\". Not visible on the page."
          - label: "Line Above Your Name"
            name: "roleLine"
            widget: "string"
            required: false
            hint: "Small orange line above \"Amal Davis\", e.g. \"Photographer & filmmaker · Scarborough, Ontario\". Leave empty to hide it."
          - label: "Tagline"
            name: "tagline"
            widget: "string"
            required: false
            hint: "One short sentence in the black bar under the opening image, e.g. \"Photographer by passion. Engineer by profession.\" Leave empty to hide it."

  # ───────────────────────── Photography ─────────────────────────
  - name: "photos"
    label: "Photography"
    description: "Your photo projects. The first three appear on the home page; drag to reorder."
    files:
      - file: "content/photos.json"
        label: "Photo Projects"
        name: "photos"
        fields:
          - label: "Projects"
            name: "projects"
            widget: "list"
            summary: "{{title}}"
            hint: "Each project is one shoot or series with its own gallery page. Drag to reorder: the order here is the order on the site."
            fields:
              - label: "Title"
                name: "title"
                widget: "string"
                hint: "The project's name, shown under its thumbnail and at the top of its gallery, e.g. \"Morning in the hills\"."
              - label: "Web Address Name"
                name: "slug"
                widget: "string"
                pattern: ["^[a-z0-9]+(-[a-z0-9]+)*$", "Lowercase letters, numbers and hyphens only"]
                hint: "The end of the project's web address, e.g. \"morning-in-the-hills\" gives thedframes.com/photos.html?project=morning-in-the-hills. Lowercase letters, numbers and hyphens only. Must be different for every project. Changing it later breaks links people have saved."
              - label: "Place"
                name: "place"
                widget: "string"
                required: false
                hint: "Where it was shot, e.g. \"Scarborough, ON\". Shown next to the date. Leave empty to hide it."
              - label: "Date"
                name: "date"
                widget: "string"
                required: false
                hint: "When it was shot, written how you want it to read, e.g. \"October 2025\" or just \"2025\". Leave empty to hide it."
              - label: "Thumbnail"
                name: "coverImage"
                widget: "image"
                hint: "The picture that represents this project in lists. Use a landscape photo, at least 1800px across; it is cropped to a wide strip, so keep the subject near the middle."
              - label: "Thumbnail Description"
                name: "coverAlt"
                widget: "string"
                required: false
                hint: "One sentence describing the thumbnail for screen readers. Not visible. If empty, the project title is used."
              - label: "Description"
                name: "description"
                widget: "text"
                required: false
                hint: "A sentence or two shown under the title on the project's gallery page. Leave empty to show nothing."
              - label: "Photos"
                name: "photos"
                widget: "list"
                required: false
                summary: "{{label}}"
                hint: "The photos in this project's gallery, in the order shown. They are displayed uncropped, exactly as uploaded. For fast loading, export at about 2400px on the long edge."
                fields:
                  - label: "Image"
                    name: "image"
                    widget: "image"
                    hint: "The photo itself."
                  - label: "Caption"
                    name: "label"
                    widget: "string"
                    required: false
                    hint: "Short caption shown under the photo when it is opened full screen, e.g. \"Golden hour\". Leave empty for no caption."
                  - label: "Description"
                    name: "alt"
                    widget: "string"
                    required: false
                    hint: "One sentence describing the photo for screen readers. Not visible. If empty, the caption is used."

  # ───────────────────────── Film ─────────────────────────
  - name: "film"
    label: "Film"
    description: "Your films. The first two appear on the home page; drag to reorder."
    files:
      - file: "content/film.json"
        label: "Films"
        name: "film"
        fields:
          - label: "Films"
            name: "items"
            widget: "list"
            summary: "{{title}}"
            hint: "Each entry is one film hosted on YouTube. Drag to reorder."
            fields:
              - label: "Title"
                name: "title"
                widget: "string"
                hint: "The film's name, e.g. \"Still water\"."
              - label: "Category"
                name: "category"
                widget: "string"
                required: false
                hint: "A short label shown under the title, e.g. \"Travel\" or \"Short film\". Leave empty to hide it."
              - label: "Year"
                name: "year"
                widget: "string"
                required: false
                hint: "The year it was made, e.g. \"2026\". Shown after the category. Leave empty to hide it."
              - label: "Description"
                name: "description"
                widget: "text"
                required: false
                hint: "One or two sentences shown under the title. Leave empty to show nothing."
              - label: "Length"
                name: "timestamp"
                widget: "string"
                required: false
                hint: "How long the film runs, e.g. \"3:42\". Shown in the corner of the thumbnail. Leave empty to hide it."
              - label: "YouTube Video ID"
                name: "videoId"
                widget: "string"
                pattern: ["^[A-Za-z0-9_-]{11}$", "A YouTube ID is exactly 11 characters"]
                hint: "The 11 characters after \"v=\" in the YouTube link. For youtube.com/watch?v=dQw4w9WgXcQ enter dQw4w9WgXcQ. Without a valid ID the film is listed but cannot be played."
              - label: "Thumbnail"
                name: "thumbnail"
                widget: "image"
                hint: "The still shown before the film plays. Use a 16:9 landscape image, at least 1600px across."
              - label: "Thumbnail Description"
                name: "alt"
                widget: "string"
                required: false
                hint: "One sentence describing the thumbnail for screen readers. Not visible. If empty, the film title is used."

  # ───────────────────────── About ─────────────────────────
  - name: "about"
    label: "About Page"
    description: "The page about you."
    files:
      - file: "content/about.json"
        label: "About Content"
        name: "about"
        fields:
          - label: "Portrait"
            name: "portrait"
            widget: "image"
            required: false
            hint: "A photo of you, shown on the left of the About page. Upright works best, about 4:5 (e.g. 1200×1500px). Leave empty and the page shows text only."
          - label: "Portrait Description"
            name: "portraitAlt"
            widget: "string"
            required: false
            hint: "One sentence describing the portrait for screen readers. Not visible. If empty, \"Amal Davis\" is used."
          - label: "Headline"
            name: "headline"
            widget: "string"
            required: false
            hint: "The large heading, e.g. \"Photographer by passion. Engineer by profession.\" The first sentence is shown in orange."
          - label: "Bio"
            name: "bio"
            widget: "text"
            required: false
            hint: "Your story, in your own words. Leave a blank line between paragraphs."

  # ───────────────────────── Site settings ─────────────────────────
  - name: "site"
    label: "Site Settings"
    description: "Contact details used in the footer of every page and on the About page."
    files:
      - file: "content/site.json"
        label: "Contact Details"
        name: "site"
        fields:
          - label: "Email Address"
            name: "email"
            widget: "string"
            required: false
            hint: "Where visitors can write to you, e.g. hello@thedframes.com. Leave empty to hide the email everywhere."
          - label: "Instagram Link"
            name: "instagram"
            widget: "string"
            required: false
            hint: "The full link to your Instagram, starting with https://. Leave empty to hide it."
          - label: "YouTube Link"
            name: "youtube"
            widget: "string"
            required: false
            hint: "The full link to your YouTube channel, starting with https://. Leave empty to hide it."
