backend:
  name: github
  repo: deninluvis/thedframes
  branch: main
  base_url: https://thedframes-cms.netlify.app
  auth_endpoint: auth

media_folder: "uploads"
public_folder: "/uploads"

collections:
  - name: "home"
    label: "Home Page"
    files:
      - file: "content/home.json"
        label: "Hero Mosaic"
        name: "home"
        fields:
          - label: "Mosaic Images"
            name: "mosaic"
            widget: "list"
            hint: "Up to 4 images shown in the homepage mosaic."
            max: 4
            fields:
              - { label: "Image", name: "image", widget: "image" }
              - { label: "Alt Text", name: "alt", widget: "string" }

  - name: "photos"
    label: "Photography"
    files:
      - file: "content/photos.json"
        label: "Photo Gallery"
        name: "photos"
        fields:
          - label: "Photos"
            name: "items"
            widget: "list"
            fields:
              - { label: "Label", name: "label", widget: "string" }
              - { label: "Image", name: "image", widget: "image" }
              - { label: "Alt Text", name: "alt", widget: "string", required: false }

  - name: "film"
    label: "Film"
    files:
      - file: "content/film.json"
        label: "Film Reel"
        name: "film"
        fields:
          - label: "Films"
            name: "items"
            widget: "list"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Category", name: "category", widget: "string" }
              - { label: "Description", name: "description", widget: "text" }
              - { label: "Duration", name: "timestamp", widget: "string", hint: "e.g. 3:42" }
              - { label: "YouTube Video ID", name: "videoId", widget: "string", hint: "The part after ?v= in the YouTube URL" }
              - { label: "Thumbnail", name: "thumbnail", widget: "image" }
              - { label: "Alt Text", name: "alt", widget: "string", required: false }

  - name: "about"
    label: "About Page"
    files:
      - file: "content/about.json"
        label: "About Content"
        name: "about"
        fields:
          - { label: "Hero Image", name: "heroImage", widget: "image", required: false }
          - { label: "Hero Image Alt", name: "heroAlt", widget: "string", required: false }
          - { label: "Photographer Portrait", name: "photographerPortrait", widget: "image", required: false }
          - { label: "Photographer Alt", name: "photographerAlt", widget: "string", required: false }
          - { label: "Videographer Portrait", name: "videographerPortrait", widget: "image", required: false }
          - { label: "Videographer Alt", name: "videographerAlt", widget: "string", required: false }
